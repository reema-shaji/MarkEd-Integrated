name: Keep Render backend warm

# Render's free tier spins the API down after ~15 minutes of inactivity, then
# takes 30-60s to cold-start on the next request — which is what makes the
# deployed app feel slow. This pings the health endpoint on a schedule so the
# service stays warm during use.
#
# Setup: add a repository variable RENDER_API_URL (Settings → Secrets and
# variables → Actions → Variables) set to your API URL,
# e.g. https://marked-api.onrender.com
#
# Note on free-tier hours: a free Render web service gets ~750 instance-hours a
# month; pinging every 10 minutes keeps it awake ~24/7, which is close to that
# cap. Widen the cron (e.g. only during the day) or use a paid instance for a
# sustained deployment. A dedicated uptime service (UptimeRobot, cron-job.org)
# is more reliable than GitHub's scheduler, which can be delayed and is paused
# after 60 days of repo inactivity.

on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API health endpoint
        run: |
          URL="${{ vars.RENDER_API_URL }}"
          if [ -z "$URL" ]; then
            echo "RENDER_API_URL repo variable is not set — skipping."
            exit 0
          fi
          echo "Pinging $URL/api/health/health"
          # -m 90 allows for a cold start; a slow first response still counts as warming it.
          curl -fsS -m 90 "$URL/api/health/health" && echo " — OK" || echo "ping failed (backend may still be waking)"
