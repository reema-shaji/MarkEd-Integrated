<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>MarkEd</title>
        {% load static %}
        <link rel="stylesheet"
              href="{% static '/plugins/bootstrap-5.0.1-dist/css/bootstrap.min.css' %}" />
        <link rel="shortcut icon" href="{% static '/images/favicon.png' %}" />
        <script src="/statics/js/jquery-3.5.1.min.js"></script>
        <script src="{% static '/plugins/bootstrap-5.0.1-dist/js/bootstrap.min.js' %}"></script>
        <link rel="stylesheet" type="text/css" href="/statics/css/main.css" />
    </head>
    <body>
    <div class="container-fluid p-0">
            <div class="row m-0 bg-white"  style="background: white">
                <div class="row m-0 p-0 bg-white" style="height : 80px; background: white">
                    <nav class="navbar navbar-expand-lg navbar-light bg-white"
                         style="box-shadow: 0px 16px 18px -15px lightgrey">
                        <div class="container-fluid">
                            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                                <a class="navbar-nav me-auto mb-2 mb-lg-0 text-decoration-none" href="/">
                                    <h1 style="color: black;">MarkEd</h1>
                                </a>
                                <!-- <div class="d-flex">
                                    <button type="button"
                                            class="btn btn-lg text-white"
                                            style="margin-right: 20px;
                                                   background-color : #454574">Help</button>
                                    {% comment %} This is where the notifications start. {% endcomment %}
                                </div> -->
                            </div>
                        </div>
                    </nav>
                </div>
            </div>

        <div class="container-fluid text-white vh-100 bg-light" style="background: rgb(252,247,255);">
            <div class="row h-100 justify-content-center align-items-center">
                <div style="max-width: 400px;
                            background-color: #20323C;
                            box-shadow: 0px 0px 18px 11px lightgrey"
                     class="col w-100 py-5 px-4 rounded">
                    <form action="/login/" method="post">
                        {% csrf_token %}
                        <h3 class="text-center">Login Here</h3>
                        <p class="text-center">Login with your Student/Staff number and password</p>
                        {% if message %}<div class="alert alert-warning">{{ message }}</div>{% endif %}
                        <div class="form-group mb-3">
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text">
                                        <svg t="1623397334336"
                                             class="icon"
                                             viewBox="0 0 1024 1024"
                                             version="1.1"
                                             xmlns="http://www.w3.org/2000/svg"
                                             p-id="8096"
                                             width="30"
                                             height="30">
                                            <path d="M928 160H96c-17.7 0-32 14.3-32 32v640c0 17.7 14.3 32 32 32h832c17.7 0 32-14.3 32-32V192c0-17.7-14.3-32-32-32z m-40 632H136V232h752v560z" p-id="8097">
                                            </path>
                                            <path d="M610.3 476h123.4c1.3 0 2.3-3.6 2.3-8v-48c0-4.4-1-8-2.3-8H610.3c-1.3 0-2.3 3.6-2.3 8v48c0 4.4 1 8 2.3 8zM615.1 620h185.7c3.9 0 7.1-3.6 7.1-8v-48c0-4.4-3.2-8-7.1-8H615.1c-3.9 0-7.1 3.6-7.1 8v48c0 4.4 3.2 8 7.1 8zM224 673h43.9c4.2 0 7.6-3.3 7.9-7.5 3.8-50.5 46-90.5 97.2-90.5s93.4 40 97.2 90.5c0.3 4.2 3.7 7.5 7.9 7.5H522c4.6 0 8.2-3.8 8-8.4-2.8-53.3-32-99.7-74.6-126.1 18.1-19.9 29.1-46.4 29.1-75.5 0-61.9-49.9-112-111.4-112s-111.4 50.1-111.4 112c0 29.1 11 55.5 29.1 75.5-42.7 26.5-71.8 72.8-74.6 126.1-0.4 4.6 3.2 8.4 7.8 8.4z m149-262c28.5 0 51.7 23.3 51.7 52s-23.2 52-51.7 52-51.7-23.3-51.7-52 23.2-52 51.7-52z" p-id="8098">
                                            </path>
                                        </svg>
                                    </span>
                                </div>
                                <input type="text"
                                       placeholder="Student/Staff Number"
                                       class="form-control"
                                       required
                                       name="usernumber" />
                            </div>
                        </div>
                        <div class="form-group mb-3">
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text">
                                        <svg t="1623046709847"
                                             class="icon"
                                             viewBox="0 0 1024 1024"
                                             version="1.1"
                                             xmlns="http://www.w3.org/2000/svg"
                                             p-id="8234"
                                             width="30"
                                             height="30">
                                            <path d="M608 112c-167.9 0-304 136.1-304 304 0 70.3 23.9 135 63.9 186.5l-41.1 41.1-62.3-62.3c-3.1-3.1-8.2-3.1-11.4 0l-39.8 39.8c-3.1 3.1-3.1 8.2 0 11.4l62.3 62.3-44.9 44.9-62.3-62.3c-3.1-3.1-8.2-3.1-11.4 0l-39.8 39.8c-3.1 3.1-3.1 8.2 0 11.4l62.3 62.3-65.3 65.3c-3.1 3.1-3.1 8.2 0 11.3l42.3 42.3c3.1 3.1 8.2 3.1 11.3 0l253.6-253.6C473 696.1 537.7 720 608 720c167.9 0 304-136.1 304-304S775.9 112 608 112z m161.2 465.2C726.2 620.3 668.9 644 608 644c-60.9 0-118.2-23.7-161.2-66.8-43.1-43-66.8-100.3-66.8-161.2 0-60.9 23.7-118.2 66.8-161.2 43-43.1 100.3-66.8 161.2-66.8 60.9 0 118.2 23.7 161.2 66.8 43.1 43 66.8 100.3 66.8 161.2 0 60.9-23.7 118.2-66.8 161.2z" p-id="8235">
                                            </path>
                                        </svg>
                                    </span>
                                </div>
                                <input type="password"
                                       id="showPassword"
                                       placeholder="Password"
                                       class="form-control"
                                       required
                                       name="password" />
                            </div>
                        </div>
                        <div class="form-group">
                            <button type="submit" name="reg_user" class="btn btn-primary w-100">Log In</button>
                        </div>
                    </form>
                    <!-- <div class="text-center">
                        Not Registered Yet ? <a href="/signup">Signup Here</a>
                    </div> -->
                </div>
                <div class="text-center" style="color: #8d8d8d; font-size: 16px;">
                    You have been given your login details by your lecturer. <br/>
                    If you are having trouble, please contact {{ SUPPORT_EMAIL }}
                </div>
            </div>
        </div>
            </div>
    </body>
</html>
