<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MarkEd - Change Password</title>
    {% load static %}
    <link
      rel="stylesheet"
      href="{% static '/plugins/bootstrap-5.0.1-dist/css/bootstrap.min.css' %}" />
    <link rel="shortcut icon" href="{% static '/images/favicon.png' %}" />
    <script src="/statics/js/jquery-3.5.1.min.js"></script>
    <script src="{% static '/plugins/bootstrap-5.0.1-dist/js/bootstrap.min.js' %}"></script>
    <link rel="stylesheet" type="text/css" href="/statics/css/main.css" />
  </head>
  <body>
    <div class="container-fluid text-white vh-100 bg-light">
      <div class="row h-100 justify-content-center align-items-center">
        <div
          class="col w-100 py-5 px-4 rounded"
          style="max-width: 400px; background-color: #20323c">
          <form action="/change-password/" method="post">
            {% csrf_token %}
            <h3 class="text-center">Change Password</h3>
            <p class="text-center">Please change your default password</p>
            {% if message %}
            <div class="alert alert-warning">{{ message }}</div>
            {% endif %}

            <div class="form-group mb-3">
              <div class="input-group">
                <input
                  type="password"
                  id="new_password"
                  placeholder="New Password"
                  class="form-control"
                  required
                  name="new_password" />
              </div>
              <div class="password-requirements text-light mt-2">
                <small
                  ><span id="length-check" class="requirement"
                    >❌ At least 8 characters</span
                  ></small
                ><br />
                <small
                  ><span id="uppercase-check" class="requirement"
                    >❌ At least 1 uppercase letter</span
                  ></small
                ><br />
                <small
                  ><span id="lowercase-check" class="requirement"
                    >❌ At least 1 lowercase letter</span
                  ></small
                ><br />
                <small
                  ><span id="number-check" class="requirement"
                    >❌ At least 1 number</span
                  ></small
                >
              </div>
            </div>

            <div class="form-group mb-3">
              <div class="input-group">
                <input
                  type="password"
                  id="confirm_password"
                  placeholder="Confirm New Password"
                  class="form-control"
                  required
                  name="confirm_password" />
              </div>
              <div id="password-match" class="text-light mt-2">
                <small
                  ><span class="requirement">❌ Passwords match</span></small
                >
              </div>
            </div>

            <div class="form-group">
              <button type="submit" class="btn btn-primary w-100">
                Change Password
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      document
        .getElementById('new_password')
        .addEventListener('input', function () {
          const password = this.value

          document.getElementById('length-check').innerHTML =
            (password.length >= 8 ? '✅' : '❌') + ' At least 8 characters'

          document.getElementById('uppercase-check').innerHTML =
            (/[A-Z]/.test(password) ? '✅' : '❌') +
            ' At least 1 uppercase letter'

          document.getElementById('lowercase-check').innerHTML =
            (/[a-z]/.test(password) ? '✅' : '❌') +
            ' At least 1 lowercase letter'

          document.getElementById('number-check').innerHTML =
            (/[0-9]/.test(password) ? '✅' : '❌') + ' At least 1 number'

          checkPasswordsMatch()
        })

      document
        .getElementById('confirm_password')
        .addEventListener('input', checkPasswordsMatch)

      function checkPasswordsMatch() {
        const password = document.getElementById('new_password').value
        const confirmPassword =
          document.getElementById('confirm_password').value

        document.getElementById(
          'password-match'
        ).innerHTML = `<small><span class="requirement">${
          password === confirmPassword && password !== '' ? '✅' : '❌'
        } Passwords match</span></small>`
      }
    </script>
  </body>
</html>
