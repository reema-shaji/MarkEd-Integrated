# Render blueprint for the unified MarkEd system — BACKEND ONLY.
#
# The frontend is hosted on Vercel (its natural home for Next.js); this file
# declares only the API, Postgres and Redis on Render. The two talk cross-origin
# over CORS, and auth is a bearer token (not a cookie), so no shared domain or
# cookie config is needed — see MarkEd-back/MarkEd/api/token_auth.py.
#
# STATUS: starting blueprint — expect to reconcile a few specifics on the first
# deploy (marked ⚠). The MySQL→Postgres switch it relies on (DATABASE_URL) is
# implemented and verified locally.
#
#   Vercel (Next.js SPA)  ──HTTPS + Bearer token──▶  Render: marked-api
#     *.vercel.app                                     ├─ Postgres (marked-db)
#                                                      └─ Redis   (marked-redis)
#
# File storage (submission/instruction PDFs) uses AWS S3 — Render has no object
# store. Set the four AWS_* vars below; without them the app runs but PDFs will
# not load.

databases:
  - name: marked-db
    databaseName: markeddb1
    user: marked
    plan: free

services:
  # --- Redis (bearer-token store + Celery broker) --------------------------
  - type: redis
    name: marked-redis
    plan: free
    ipAllowList: []            # internal only
    maxmemoryPolicy: noeviction

  # --- Backend: Django + django-ninja API ----------------------------------
  - type: web
    name: marked-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.django
    dockerContext: ./MarkEd-back
    plan: free
    healthCheckPath: /api/health/health
    # ⚠ The image's default CMD runs the dev server; on Render bind the provided
    # PORT and serve with uvicorn. `seed_demo` self-gates on SEED_ON_START (a
    # no-op unless it is "true") and is idempotent, so it is safe on every boot.
    dockerCommand: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_demo &&
             uvicorn MarkEd.asgi:application --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marked-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: marked-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL   # free tier has no worker; see note at foot
        fromService:
          name: marked-redis
          type: redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ENV
        value: production        # DEBUG=False; enables secure cookies + proxy SSL
      - key: ALLOWED_HOSTS
        value: ".onrender.com"

      # --- Demo seed --------------------------------------------------------
      # A fresh Postgres has no users, so nobody could log in without this.
      # SEED_ON_START=true seeds idempotent demo accounts on boot; set it to
      # "false" once real data exists. SEED_DEMO_PASSWORD sets those accounts'
      # password — leave it unset for the local default (Test1234!), but set a
      # private value for any public deployment.
      - key: SEED_ON_START
        value: "true"
      - key: SEED_DEMO_PASSWORD
        sync: false              # ⚠ set a private password for a public deploy

      # --- CORS: allow the Vercel frontend to call this API ------------------
      # Auth is a bearer token, so credentials/cookies are NOT sent cross-origin;
      # CORS only needs to allow the frontend's Origin. CORS_ALLOW_VERCEL=true
      # allows every *.vercel.app URL (preview + production). To pin a single
      # custom domain instead, set CORS_ALLOWED_ORIGINS to it.
      - key: CORS_ALLOW_VERCEL
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false              # ⚠ optional: a custom (non-vercel.app) frontend domain
      - key: CSRF_TRUSTED_ORIGINS
        sync: false              # ⚠ optional: only for the legacy Django admin/template pages

      # --- File storage: AWS S3 (required for PDFs) --------------------------
      - key: AWS_ACCESS_KEY_ID
        sync: false              # ⚠ set to your IAM key
      - key: AWS_SECRET_ACCESS_KEY
        sync: false              # ⚠ set to your IAM secret
      - key: AWS_REGION
        sync: false              # ⚠ e.g. eu-west-2
      - key: STORAGE_BUCKET_NAME
        sync: false              # ⚠ your S3 bucket name

      # --- AI peer-review suggestions (optional) -----------------------------
      # The peer review flow works without this; only the AI coaching needs it.
      - key: OPENAI_API_KEY
        sync: false

# NOTE — Celery on the free tier: Render's free plan has no background worker,
# so AI suggestion tasks cannot run asynchronously (they queue but never run).
# Peer review itself works fine; to enable AI coaching, upgrade and add a
# `type: worker` service running `celery -A MarkEd worker -l info`.
#
# --- Deploying the frontend on Vercel ---------------------------------------
# 1. Vercel → New Project → import this repo, Root Directory: MarkEd-front
# 2. Env var: NEXT_PUBLIC_API_URL = https://marked-api.onrender.com
#    (the API service URL, available after the first Render deploy)
# 3. Deploy. Vercel assigns e.g. https://marked-<hash>.vercel.app, which
#    CORS_ALLOW_VERCEL already permits.
